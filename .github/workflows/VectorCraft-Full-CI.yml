name: VectorCraft Greek PR - Full CI

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-ci:
    name: cargo xtask ci - Greek PR 2076
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - name: Checkout Greek localization PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/greek-localization
          persist-credentials: false

      - name: Confirm the branch and commit
        run: |
          git log -1 --format='%h %s'
          test "$(git branch --show-current)" = "feature/greek-localization"
          df -h .

      - name: Free space on the temporary GitHub runner
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h .

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang libclang-dev libssl-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev \
            libfreetype-dev libvulkan-dev libasound2-dev libudev-dev

      - name: Install stable Rust with required components and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Run the complete project CI gate
        shell: bash
        run: |
          set -o pipefail
          cargo xtask ci 2>&1 | tee vectorcraft-ci.log

      - name: Upload full CI output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vectorcraft-greek-ci-log
          path: vectorcraft-ci.log
          if-no-files-found: warn
